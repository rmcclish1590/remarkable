[package]
name = "rmsync"
version = "0.1.0"
edition = "2021"
description = "Bi-directional sync for reMarkable 2 tablets on Linux"
license = "MIT"

[dependencies]
# UI
gtk = { version = "0.9", package = "gtk4", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_2"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-channel = "2"

# SSH/SFTP
russh = "0.46"
russh-sftp = "2"
russh-keys = "0.46"
async-trait = "0.1"
ssh-key = { version = "0.6", features = ["ed25519"] }
rand = "0.8"

# Config paths
dirs = "5"

# USB detection
udev = "0.9"

# File watching
notify = "7"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Binary parsing
nom = "7"

# SVG
resvg = "0.44"

# Hashing
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# File timestamps
filetime = "0.2"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "rmSync Contributors"
copyright = "2026, rmSync Contributors"
license-file = ["LICENSE", "0"]
extended-description = """
rmSync provides bi-directional synchronization between a reMarkable 2 \
tablet and a Linux desktop. It detects the tablet over USB, syncs \
documents in both directions, and includes a built-in viewer for \
handwritten notebooks and PDFs."""
section = "utils"
priority = "optional"
depends = "$auto, openssh-client"
maintainer-scripts = "assets/"
assets = [
    ["target/release/rmsync", "usr/bin/", "755"],
    ["assets/rmsync.desktop", "usr/share/applications/", "644"],
    ["assets/rmsync.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/rmsync-48.png", "usr/share/icons/hicolor/48x48/apps/rmsync.png", "644"],
    ["assets/99-remarkable.rules", "etc/udev/rules.d/", "644"],
    ["scripts/rm_to_svg.py", "usr/share/rmsync/", "755"],
]
