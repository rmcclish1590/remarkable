<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tablet body -->
  <rect x="14" y="8" width="36" height="48" rx="4" ry="4"
        fill="#f5f5f5" stroke="#2b2b2b" stroke-width="2"/>
  <!-- Screen area -->
  <rect x="18" y="12" width="28" height="40" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <!-- Pen strokes suggesting handwriting -->
  <path d="M22 22 Q26 18 30 22 T38 22" fill="none" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M22 30 H42" fill="none" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M22 36 H38" fill="none" stroke="#2b2b2b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Sync arrows in bottom-right corner -->
  <g transform="translate(40 40)">
    <path d="M0 6 A6 6 0 1 1 6 12" fill="none" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
    <polygon points="4,10 8,12 6,8" fill="#3584e4"/>
    <path d="M12 6 A6 6 0 1 0 6 0" fill="none" stroke="#3584e4" stroke-width="2" stroke-linecap="round"/>
    <polygon points="8,2 4,0 6,4" fill="#3584e4"/>
  </g>
</svg>
